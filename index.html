<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traducteur de Symboles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Zone de texte du haut -->
        <div class="text-display-area">
            <p id="displayText">Ici apparaîtra le texte tapé...</p>
        </div>

        <!-- Zone du clavier des symboles -->
        <div class="symbols-keyboard">
            <!-- Nous allons générer les touches ici à l'aide de données réutilisables -->
            <!-- Pour cet exemple, je liste les touches manuellement -->
            
            <div class="key-row">
                <button class="symbol-key" data-letter="A"><span class="letter">A</span><span class="symbol-pixel" style="--char-index: 0;"></span></button>
                <button class="symbol-key" data-letter="B"><span class="letter">B</span><span class="symbol-pixel" style="--char-index: 1;"></span></button>
                <button class="symbol-key" data-letter="C"><span class="letter">C</span><span class="symbol-pixel" style="--char-index: 2;"></span></button>
                <button class="symbol-key" data-letter="D"><span class="letter">D</span><span class="symbol-pixel" style="--char-index: 3;"></span></button>
                <button class="symbol-key" data-letter="E"><span class="letter">E</span><span class="symbol-pixel" style="--char-index: 4;"></span></button>
                <button class="symbol-key" data-letter="F"><span class="letter">F</span><span class="symbol-pixel" style="--char-index: 5;"></span></button>
                <button class="symbol-key" data-letter="G"><span class="letter">G</span><span class="symbol-pixel" style="--char-index: 6;"></span></button>
                <button class="symbol-key" data-letter="H"><span class="letter">H</span><span class="symbol-pixel" style="--char-index: 7;"></span></button>
                <button class="symbol-key" data-letter="I"><span class="letter">I</span><span class="symbol-pixel" style="--char-index: 8;"></span></button>
                <button class="symbol-key" data-letter="J"><span class="letter">J</span><span class="symbol-pixel" style="--char-index: 9;"></span></button>
                <button class="symbol-key" data-letter="K"><span class="letter">K</span><span class="symbol-pixel" style="--char-index: 10;"></span></button>
                <button class="symbol-key" data-letter="L"><span class="letter">L</span><span class="symbol-pixel" style="--char-index: 11;"></span></button>
                <button class="symbol-key" data-letter="M"><span class="letter">M</span><span class="symbol-pixel" style="--char-index: 12;"></span></button>
            </div>
            
            <div class="key-row">
                <button class="symbol-key" data-letter="N"><span class="letter">N</span><span class="symbol-pixel" style="--char-index: 13;"></span></button>
                <button class="symbol-key" data-letter="O"><span class="letter">O</span><span class="symbol-pixel" style="--char-index: 14;"></span></button>
                <button class="symbol-key" data-letter="P"><span class="letter">P</span><span class="symbol-pixel" style="--char-index: 15;"></span></button>
                <button class="symbol-key" data-letter="Q"><span class="letter">Q</span><span class="symbol-pixel" style="--char-index: 16;"></span></button>
                <button class="symbol-key" data-letter="R"><span class="letter">R</span><span class="symbol-pixel" style="--char-index: 17;"></span></button>
                <button class="symbol-key" data-letter="S"><span class="letter">S</span><span class="symbol-pixel" style="--char-index: 18;"></span></button>
                <button class="symbol-key" data-letter="T"><span class="letter">T</span><span class="symbol-pixel" style="--char-index: 19;"></span></button>
                <button class="symbol-key" data-letter="U"><span class="letter">U</span><span class="symbol-pixel" style="--char-index: 20;"></span></button>
                <button class="symbol-key" data-letter="V"><span class="letter">V</span><span class="symbol-pixel" style="--char-index: 21;"></span></button>
                <button class="symbol-key" data-letter="W"><span class="letter">W</span><span class="symbol-pixel" style="--char-index: 22;"></span></button>
                <button class="symbol-key" data-letter="X"><span class="letter">X</span><span class="symbol-pixel" style="--char-index: 23;"></span></button>
                <button class="symbol-key" data-letter="Y"><span class="letter">Y</span><span class="symbol-pixel" style="--char-index: 24;"></span></button>
                <button class="symbol-key" data-letter="Z"><span class="letter">Z</span><span class="symbol-pixel" style="--char-index: 25;"></span></button>
            </div>
            
            <!-- Contrôles -->
            <div class="key-row controls-row">
                <button class="control-key" id="spaceKey">ESPACE</button>
                <button class="control-key" id="clearKey">EFFACER</button>
            </div>
        </div>
    </div>

    <!-- Script simple pour la démo d'interaction (optionnel) -->
    <script>
        const displayText = document.getElementById('displayText');
        const keyboard = document.querySelector('.symbols-keyboard');
        let currentText = "";

        keyboard.addEventListener('click', (e) => {
            const key = e.target.closest('button');
            if (!key) return;

            if (key.classList.contains('symbol-key')) {
                currentText += key.dataset.letter;
            } else if (key.id === 'spaceKey') {
                currentText += " ";
            } else if (key.id === 'clearKey') {
                currentText = "";
            }

            displayText.textContent = currentText || "Ici apparaîtra le texte tapé...";
        });
    </script>
</body>
</html>
